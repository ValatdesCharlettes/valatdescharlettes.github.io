<title>Feuille de garde</title><style>@font-face{font-family:Manrope;src:url(../manrope.ttf) format("truetype");font-weight:200 800}
:root{--bg:#F3F3F1;--surface:#FFFFFF;--ink:#161616;--muted:#666663;--line:#EBEBE7;--accent:#2F5D50}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}#m{padding:48px 0;text-align:center;color:var(--muted)}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{margin:0;font-size:28px}header p{margin:0;color:var(--muted);flex-basis:100%;order:2}
button{font:inherit;font-weight:700;border:0;border-radius:999px;background:var(--accent);color:#fff;padding:10px 18px}
section{background:var(--surface);border-radius:24px;padding:16px 20px;margin-bottom:12px}
h2{margin:0 0 8px;font-size:20px}h3{margin:0;font-size:17px}ul{margin:4px 0;padding-left:20px}p{margin:4px 0}
.contacts{list-style:none;padding:0}.contacts li{padding:6px 0;border-bottom:1px solid var(--line)}.contacts span{display:block;color:var(--muted);font-size:14px}
a{color:var(--accent);font-weight:700}.dog{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.dog img{width:84px;height:84px;object-fit:cover;border-radius:16px;flex:none}.box{color:var(--muted);font-size:14px}
.note{background:var(--bg);border-radius:12px;padding:6px 10px;margin-top:6px}.day{padding:8px 0;border-bottom:1px solid var(--line)}
.day.today{border-left:4px solid var(--accent);padding-left:10px}.none{color:var(--muted)}
@media print{body{background:#fff}button{display:none}section{padding:0;border-radius:0}.day{break-inside:avoid}.dog{break-inside:avoid}}</style></head>
